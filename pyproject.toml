[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t1d-tkg"
version = "0.1.0"
description = "Leakage-aware temporal patient-event graph benchmark for T1D hypoglycemia research"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
